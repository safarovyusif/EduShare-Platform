<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <title>Qeydiyyat - EduShare</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="min-height: 100vh; padding: 20px;">
    <div class="card shadow p-4" style="width: 500px; border-radius: 15px;">
        <div class="text-center mb-4">
            <h2 class="fw-bold text-primary">EduShare Qeydiyyat</h2>
            <p class="text-muted">Təhsil icmasına qoşulun</p>
        </div>
        <form action="/register" method="POST">
            <div class="mb-3">
                <label class="form-label">İstifadəçi adı</label>
                <input type="text" name="username" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">E-poçt</label>
                <input type="email" name="email" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Şifrə</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Universitet</label>
                <select name="university" class="form-select" required>
                    <option value="" disabled selected>Seçin...</option>
                    {% for uni in universities %}
                    <option value="{{ uni }}">{{ uni }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="mb-4">
                <label class="form-label">Kurs</label>
                <select name="course" class="form-select" required>
                    <option value="1">1-ci Kurs</option>
                    <option value="2">2-ci Kurs</option>
                    <option value="3">3-cü Kurs</option>
                    <option value="4">4-cü Kurs</option>
                    <option value="5">5-ci Kurs (və ya Magistr)</option>
                    <option value="0">Məzun / Digər</option>
                </select>
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2 rounded-pill mb-2">Qeydiyyatdan Keç</button>
            <div class="text-center"><a href="/" class="text-decoration-none small">Artıq hesabınız var? Daxil olun.</a></div>
        </form>
    </div>
</body>
</html>
