{% extends 'base.html' %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow border-0 rounded-4">
                <div class="card-header bg-primary text-white text-center py-3 rounded-top-4">
                    <h5 class="mb-0"><i class="fas fa-user-edit me-2"></i>Profilə Düzəliş Et</h5>
                </div>
                <div class="card-body p-4">
                    <p class="text-muted small text-center mb-4">Məlumatlarınızı aşağıdan yeniləyə bilərsiniz.</p>
                    
                    <form action="{{ url_for('edit_profile') }}" method="POST">
                        <div class="mb-3">
                            <label class="form-label fw-bold">İstifadəçi Adı</label>
                            <input type="text" name="new_username" class="form-control" value="{{ user.username }}" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">E-poçt ünvanı</label>
                            <input type="email" name="new_email" class="form-control" value="{{ user.email }}" required>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-bold text-danger">Yeni Şifrə</label>
                            <input type="password" name="new_password" class="form-control" placeholder="Şifrəni dəyişmək istəmirsinizsə boş saxlayın">
                        </div>
                        
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-success btn-lg rounded-pill">Yadda Saxla</button>
                            <a href="{{ url_for('profile') }}" class="btn btn-light rounded-pill">Ləğv Et</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
